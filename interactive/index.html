          const cmdTitle = (lang === 'pt') ? 'COMANDOS DE INJEÇÃO (TERMINAL):' : (lang === 'es' ? 'COMANDOS DE INYECCIÓN (TERMINAL):' : 'TERMINAL PAYLOAD INJECTION SNIPPET:');
          const mobileTip = (lang === 'pt') ?
            'No Celular (Android / iOS): Conecte ao mesmo Wi-Fi e use qualquer app cliente TCP/Netcat para enviar <code>etaHEN.bin</code> para ' + ip + ':' + port :
            (lang === 'es' ?
            'En Teléfono (Android / iOS): Conecta a la misma red Wi-Fi y usa cualquier app cliente TCP/Netcat para enviar <code>etaHEN.bin</code> a ' + ip + ':' + port :
            'Mobile (Android / iOS): Connect to same Wi-Fi and use any TCP/Netcat client app to send <code>etaHEN.bin</code> to ' + ip + ':' + port);

          codeSnippet = `
            <div class="ps-res-actions-title" style="margin-top:16px;"><span>💻</span> 📦 ${cmdTitle}</div>
            <div class="ps-res-code-box">
              <span style="color:#94a3b8;"># Linux / macOS / WSL:</span><br>
              nc -w 3 ${ip} ${port} &lt; etaHEN.bin<br><br>
              <span style="color:#94a3b8;"># Windows PowerShell:</span><br>
              $c = New-Object Net.Sockets.TcpClient('${ip}', ${port}); $s = $c.GetStream(); $b = [IO.File]::ReadAllBytes('etaHEN.bin'); $s.Write($b, 0, $b.Length); $s.Close(); $c.Close(); Write-Host '[SUCCESS] etaHEN Sent!'<br><br>
              <span style="color:#94a3b8;"># Smartphone (Android / iOS):</span><br>
              <span style="color:#cbd5e1;">${mobileTip}</span>
            </div>
          `;
        }

        return {
          title: title,
          badge: badge,
          badgeClass: badgeClass,
          desc: desc,
          steps: steps,
          note: note,
          codeSnippet: codeSnippet
        };
      }

      function updateWizardUI() {
        const modelBtns = document.querySelectorAll('.ps-model-btn');
        modelBtns.forEach(function(btn) {
          if (btn.getAttribute('data-model') === currentWizardModel) {
            btn.classList.add('active');
          } else {
            btn.classList.remove('active');
          }
          btn.setAttribute('aria-pressed', btn.classList.contains('active') ? 'true' : 'false');
        });

        const activeBracket = getBracketForFw(currentWizardFw);

        const exploitBtns = document.querySelectorAll('.ps-exploit-btn');
        exploitBtns.forEach(function(btn) {
          if (btn.getAttribute('data-fw') === activeBracket) {
            btn.classList.add('active');
          } else {
            btn.classList.remove('active');
          }
          btn.setAttribute('aria-pressed', btn.classList.contains('active') ? 'true' : 'false');
        });

        const resultContainer = document.getElementById('psWizardResult');
        if (!resultContainer) return;

        const lang = getLanguage();
        const model = currentWizardModel;
        const ip = currentWizardIp || '192.168.1.150';
        const bracket = activeBracket;

        let statusClass = 'ready';
        let statusBadge = '';
        let exploitName = '';
        let exploitVector = '';
        let dnsIp = '45.56.67.85';
        let payloads = 'etaHEN.bin + ps5-kstuff.bin';
        let port = '9021';

        const isSlimOrPro = (model === 'slim' || model === 'pro');

        if (bracket === '1.00 - 2.50') {
          statusClass = 'ready';
          statusBadge = (lang === 'pt') ? 'ETAPAS DISPONÍVEIS • HYPERVISOR' : (lang === 'es' ? 'PASOS DISPONIBLES • HYPERVISOR' : 'STEPS AVAILABLE • HYPERVISOR');
          exploitName = (lang === 'pt') ? 'Byepervisor / IPv6 UAF' : (lang === 'es' ? 'Byepervisor / IPv6 UAF' : 'Byepervisor / IPv6 UAF');
          exploitVector = (lang === 'pt') ? 'Acesso total ao Hypervisor (Ring -1) e Kernel' : (lang === 'es' ? 'Acceso total a Hypervisor (Ring -1) y Kernel' : 'Full Hypervisor (Ring -1) root & kernel read/write');
          dnsIp = '62.210.38.117';
          payloads = 'Byepervisor + etaHEN.bin';
          port = '9021';
        } else if (bracket === '3.00 - 6.50') {
          statusClass = 'ready';
          statusBadge = (lang === 'pt') ? 'ETAPAS DISPONÍVEIS • ALTA ESTABILIDADE' : (lang === 'es' ? 'PASOS DISPONIBLES • ALTA ESTABILIDAD' : 'STEPS AVAILABLE • HIGH STABILITY');
          exploitName = (lang === 'pt') ? 'UMTX e Socket IPv6 UAF' : (lang === 'es' ? 'UMTX y Socket IPv6 UAF' : 'UMTX & IPv6 Socket UAF');
          exploitVector = (lang === 'pt') ? 'Vulnerabilidades de kernel FreeBSD libthr e netinet6' : (lang === 'es' ? 'Vulnerabilidades de kernel FreeBSD libthr y netinet6' : 'FreeBSD libthr and netinet6 kernel vulnerabilities');
          dnsIp = '62.210.38.117';
          payloads = 'etaHEN.bin + ps5-kstuff.bin';
          port = '9021';
        } else if (bracket === '7.00 - 13.60') {
          statusClass = 'ready';
          statusBadge = (lang === 'pt') ? 'ETAPAS DISPONÍVEIS • ERA MODERNA' : (lang === 'es' ? 'PASOS DISPONIBLES • ERA MODERNA' : 'STEPS AVAILABLE • MODERN ERA');
          exploitName = (lang === 'pt') ? 'Relapse Exploit (aio_multi_wait)' : (lang === 'es' ? 'Relapse Exploit (aio_multi_wait)' : 'Relapse Exploit (aio_multi_wait)');
          exploitVector = (lang === 'pt') ? 'WebKit (JSC) + condição de corrida aio_multi_wait' : (lang === 'es' ? 'WebKit (JSC) + condición de carrera aio_multi_wait' : 'WebKit (JSC) + aio_multi_wait race condition');
          dnsIp = '45.56.67.85';
          payloads = 'etaHEN.bin + ps5-kstuff.bin';
          port = '9021';
        } else {
          statusClass = 'patched';
          statusBadge = (lang === 'pt') ? 'FIRMWARE CORRIGIDO • NÃO EXPLORÁVEL' : (lang === 'es' ? 'FIRMWARE PARCHEADO • NO EXPLOITABLE' : 'FIRMWARE PATCHED • NOT EXPLOITABLE');
          exploitName = (lang === 'pt') ? 'Não explorável no firmware 14.00+' : (lang === 'es' ? 'No exploitable en firmware 14.00+' : 'Not exploitable on firmware 14.00+');
          exploitVector = (lang === 'pt') ? 'Vulnerabilidades de kernel corrigidas pela Sony na versão 14.00' : (lang === 'es' ? 'Vulnerabilidades de kernel corregidas por Sony en versión 14.00' : 'Kernel vulnerabilities patched by Sony in version 14.00');
          dnsIp = 'N/A';
          payloads = 'N/A';
          port = 'N/A';
        }

        let fwSummary = bracket.replace('-', '–');
        const stopHere = (bracket === '14.00+');

        let html = `
          <div class="ps-res-top-bar">
            <div>
              <span class="ps-res-status-pill ${statusClass}">${statusBadge}</span>
              <div class="ps-res-summary-text" style="margin-top:8px;">
                PS5 ${model.toUpperCase()} &bull; Firmware ${fwSummary}
              </div>
            </div>
            ${stopHere ? '' : `<div class="ps-res-ip">${lang === 'pt' ? 'IP DO CONSOLE' : (lang === 'es' ? 'IP DE LA CONSOLA' : 'CONSOLE IP')}: <span>${ip}</span></div>`}
          </div>
        `;

        if (isSlimOrPro) {
          const alertText = (lang === 'pt') ?
            `<strong>⚠️ AVISO SOBRE O LEITOR DE DISCO:</strong> Seu modelo possui leitor removível. O registro com a Sony pode exigir uma atualização do sistema. <strong>NÃO ATUALIZE</strong> para parear o leitor. Jogos digitais, homebrew e SSD M.2 funcionam sem o leitor físico.` :
            (lang === 'es' ?
            `<strong>⚠️ AVISO SOBRE EL LECTOR DE DISCOS:</strong> Tu modelo tiene un lector extraíble. El registro con Sony puede requerir una actualización del sistema. <strong>NO ACTUALICES</strong> para emparejar el lector. Los juegos digitales, homebrew y el SSD M.2 funcionan sin el lector físico.` :
            `<strong>⚠️ DISC DRIVE NOTICE:</strong> Your model has a detachable disc drive. Registering it with Sony may require a system update. <strong>Do not update</strong> to pair the drive. Digital games, homebrew, and the M.2 SSD work without the disc drive.`);

          html += `<div class="ps-res-hazard-alert">${alertText}</div>`;
        }

        if (stopHere) {
          const stopMessage = (lang === 'pt') ?
            '⛔ FIRMWARE NÃO EXPLORÁVEL: O Firmware 14.00 ou superior corrigiu as vulnerabilidades de kernel. Não há exploit público para esta versão. Mantenha o console estritamente offline e NÃO atualize.' :
            (lang === 'es' ?
            '⛔ FIRMWARE NO EXPLOITABLE: El Firmware 14.00 o superior ha corregido las vulnerabilidades de kernel. No existe exploit público para esta versión. Mantén la consola estrictamente offline y NO actualices.' :
            '⛔ FIRMWARE NOT EXPLOITABLE: Firmware 14.00 or higher has patched all kernel vulnerabilities. There is no public exploit available for this version. Keep the console strictly offline and DO NOT update.');

          html += `<div class="ps-res-hazard-alert">${stopMessage}</div>`;
          resultContainer.innerHTML = html;
          return;
        }

        html += `
          <div class="ps-res-grid">
            <div class="ps-res-card">
              <span class="ps-res-card-label">${lang === 'pt' ? 'SUA ROTA' : (lang === 'es' ? 'TU RUTA' : 'YOUR STEPS')}</span>
              <span class="ps-res-card-val">${exploitName}</span>
              <span class="ps-res-card-sub">${exploitVector}</span>
            </div>
            <div class="ps-res-card">
              <span class="ps-res-card-label">${lang === 'pt' ? 'DNS PRINCIPAL' : (lang === 'es' ? 'DNS PRINCIPAL' : 'PRIMARY DNS')}</span>
              <span class="ps-res-card-val" style="color:#38bdf8;">${dnsIp}</span>
              <span class="ps-res-card-sub">${lang === 'pt' ? 'Secundário' : (lang === 'es' ? 'Secundario' : 'Secondary')}: 0.0.0.0</span>
            </div>
            <div class="ps-res-card">
              <span class="ps-res-card-label">${lang === 'pt' ? 'ARQUIVOS NECESSÁRIOS' : (lang === 'es' ? 'ARCHIVOS NECESARIOS' : 'FILES NEEDED')}</span>
              <span class="ps-res-card-val" style="color:#fbbf24;">${payloads}</span>
              <span class="ps-res-card-sub">${lang === 'pt' ? 'Conexão' : (lang === 'es' ? 'Conexión' : 'Connection')}: ${port}</span>
            </div>
          </div>
        `;

        const actionTitle = (lang === 'pt') ? '⚡ SUAS ETAPAS:' : (lang === 'es' ? '⚡ TUS PASOS:' : '⚡ YOUR STEPS:');
        const bookmark3Text = (lang === 'pt') ? 'ETAPAS' : (lang === 'es' ? 'PASOS' : 'STEPS');
        const tabOnlineTitle = (lang === 'pt') ? 'COM INTERNET' : (lang === 'es' ? 'CON INTERNET' : 'WITH INTERNET');
        const tabOnlineBadge = (lang === 'pt') ? 'REDE NECESSÁRIA' : (lang === 'es' ? 'REQUIERE RED' : 'NETWORK NEEDED');
        const tabLocalTitle = (lang === 'pt') ? 'SEM INTERNET' : (lang === 'es' ? 'SIN INTERNET' : 'WITHOUT INTERNET');
        const tabLocalBadge = (lang === 'pt') ? 'DISPOSITIVO LOCAL' : (lang === 'es' ? 'DISPOSITIVO LOCAL' : 'LOCAL DEVICE');

        html += `
          <div class="ps-wizard-step" id="wizardStep3">
            <div class="ps-wizard-bookmark" aria-hidden="true">
              <span class="ps-bm-num">03</span>
              <span class="ps-bm-text">${bookmark3Text}</span>
            </div>
            <div class="ps-res-actions-title"><span>🎮</span> ${actionTitle}</div>
        `;

        html += `
          <div class="ps-res-tabs" role="tablist">
            <button type="button" role="tab" aria-selected="${currentWizardTab === 'full-online'}" class="ps-res-tab-btn ${currentWizardTab === 'full-online' ? 'active' : ''}" data-tab="full-online" onclick="switchWizardTab('full-online')">
              <span>🌐</span>
              <span>${tabOnlineTitle}</span>
              <span class="ps-res-tab-badge">${tabOnlineBadge}</span>
            </button>
            <button type="button" role="tab" aria-selected="${currentWizardTab === 'local'}" class="ps-res-tab-btn ${currentWizardTab === 'local' ? 'active' : ''}" data-tab="local" onclick="switchWizardTab('local')">
              <span>🏠</span>
              <span>${tabLocalTitle}</span>
              <span class="ps-res-tab-badge">${tabLocalBadge}</span>
            </button>
          </div>
        `;

        const stepWord = (lang === 'pt') ? 'Passo a Passo' : ((lang === 'es') ? 'Paso a Paso' : 'Step-by-Step');
        const resetLabel = (lang === 'pt') ? 'Reiniciar' : ((lang === 'es') ? 'Reiniciar' : 'Reset');
        const copyLabel = (lang === 'pt') ? 'Copiar' : ((lang === 'es') ? 'Copiar' : 'Copy');

        function renderPane(paneId, tabKey, procIds, activeId) {
          const activeData = getProcedureData(activeId, lang, bracket, ip, port);
          const stateKey = [tabKey, activeId, bracket].join('|');
          const doneSet = getDoneSet(stateKey);
          const total = activeData.steps.length;
          const doneCount = activeData.steps.filter(function(_, i) { return doneSet.indexOf(i) !== -1; }).length;
          const pct = total ? Math.round(doneCount / total * 100) : 0;
          const visible = (currentWizardTab === tabKey);
          return `
            <div id="${paneId}" class="ps-tab-pane" role="tabpanel" ${visible ? '' : 'hidden'}>
              <div class="ps-proc-grid">
                ${procIds.map(function(id) {
                  const data = getProcedureData(id, lang, bracket, ip, port);
                  const isActive = (id === activeId);
                  return `
                    <div class="ps-proc-card ${isActive ? 'active' : ''}" role="button" aria-pressed="${isActive}" tabindex="0" onclick="selectProcedure('${tabKey}', '${id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();selectProcedure('${tabKey}', '${id}')}">
                      <div class="ps-proc-header">
                        <div class="ps-proc-title">${data.title}</div>
                        <span class="ps-proc-badge ${data.badgeClass}">${data.badge}</span>
                      </div>
                      <div class="ps-proc-desc">${data.desc}</div>
                    </div>
                  `;
                }).join('')}
              </div>

              <div class="ps-proc-detail-box">
                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px;">
                  <h4 style="margin:0;color:#ffffff;font-size:16px;">${activeData.title} &bull; ${stepWord}</h4>
                  <span class="ps-proc-badge ${activeData.badgeClass}">${activeData.badge}</span>
                </div>
                ${activeData.note ? `<div class="ps-res-hazard-alert" style="margin:0 0 14px 0;">${activeData.note}</div>` : ''}
                ${total ? `
                  <div class="ps-progress-row" data-key="${stateKey}">
                    <span class="ps-step-progress" aria-live="polite">${doneCount} / ${total}</span>
                    <div class="ps-progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${doneCount}"><div class="ps-progress-fill" style="width:${pct}%"></div></div>
                    <button type="button" class="ps-link-btn" onclick="resetSteps(this)">${resetLabel}</button>
                  </div>` : ''}
                <ul class="ps-res-checklist" style="margin:0;" data-key="${stateKey}">
                  ${activeData.steps.map(function(s, idx) {
                    const isDone = doneSet.indexOf(idx) !== -1;
                    return `<li class="${isDone ? 'done' : ''}" role="checkbox" aria-checked="${isDone}" tabindex="0" data-idx="${idx}" onclick="toggleStep(this)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleStep(this)}"><span class="step-num" data-n="${idx + 1}">${isDone ? '✓' : idx + 1}</span><span>${s}</span></li>`;
                  }).join('')}
                </ul>
                ${activeData.codeSnippet ? `<div class="ps-code-wrap">${activeData.codeSnippet}<button type="button" class="ps-copy-btn" data-copy-label="${copyLabel}" onclick="copyCode(this)">${copyLabel}</button></div>` : ''}
              </div>
            </div>
          `;
        }

        html += renderPane('psTabPaneOnline', 'full-online', ['relapse', 'autoloader_cache', 'public_hosts', 'y2jb'], currentOnlineProc);
        html += renderPane('psTabPaneLocal', 'local', ['esp32', 'esp8266', 'raspberry_pi', 'local_pc'], currentLocalProc);
        html += '</div>';
        resultContainer.innerHTML = html;
      }

      function playChime() {
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (!AudioContext) return;
          const ctx = new AudioContext();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(660, ctx.currentTime);
          osc.frequency.setValueAtTime(990, ctx.currentTime + 0.09);
          gain.gain.setValueAtTime(0.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.5);
        } catch (e) {}
      }

      function showDoneToast() {
        const toast = document.getElementById('psWizardToast');
        if (!toast) return;
        const lang = getLanguage();
        toast.textContent = (lang === 'pt') ? '🏆 Todas as etapas concluídas!' : (lang === 'es' ? '🏆 ¡Todas las etapas completadas!' : '🏆 All steps complete!');
        toast.classList.add('show');
        setTimeout(function() { toast.classList.remove('show'); }, 3000);
      }

      function getAllDone() {
        try { return JSON.parse(localStorage.getItem('ps5_wizard_done') || '{}') || {}; } catch (e) { return {}; }
      }
      function getDoneSet(key) {
        const all = getAllDone();
        return Array.isArray(all[key]) ? all[key] : [];
      }
      function saveDoneSet(key, arr) {
        const all = getAllDone();
        if (arr.length) all[key] = arr; else delete all[key];
        try { localStorage.setItem('ps5_wizard_done', JSON.stringify(all)); } catch (e) {}
      }

      function refreshProgress(list) {
        const detail = list.parentElement;
        const total = list.querySelectorAll('li').length;
        const done = list.querySelectorAll('li.done').length;
        const counter = detail.querySelector('.ps-step-progress');
        const fill = detail.querySelector('.ps-progress-fill');
        const bar = detail.querySelector('.ps-progress-bar');
        if (counter) counter.textContent = done + ' / ' + total;
        if (fill) fill.style.width = (total ? Math.round(done / total * 100) : 0) + '%';
        if (bar) bar.setAttribute('aria-valuenow', done);
        return { total: total, done: done };
      }

      window.toggleStep = function(el) {
        el.classList.toggle('done');
        const isDone = el.classList.contains('done');
        el.setAttribute('aria-checked', isDone ? 'true' : 'false');
        const num = el.querySelector('.step-num');
        if (num) num.textContent = isDone ? '✓' : (num.getAttribute('data-n') || '');
        const list = el.parentElement;
        const set = [];
        list.querySelectorAll('li.done').forEach(function(li) { set.push(parseInt(li.getAttribute('data-idx'), 10)); });
        saveDoneSet(list.getAttribute('data-key'), set);
        const p = refreshProgress(list);
        if (isDone && p.total > 0 && p.done === p.total) {
          playChime();
          showDoneToast();
        }
      };

      window.resetSteps = function(btn) {
        const detail = btn.closest('.ps-proc-detail-box');
        const list = detail.querySelector('.ps-res-checklist');
        list.querySelectorAll('li').forEach(function(li) {
          li.classList.remove('done');
          li.setAttribute('aria-checked', 'false');
          const n = li.querySelector('.step-num');
          if (n) n.textContent = n.getAttribute('data-n');
        });
        saveDoneSet(list.getAttribute('data-key'), []);
        refreshProgress(list);
      };

      window.copyCode = function(btn) {
        const box = btn.parentElement.querySelector('.ps-res-code-box');
        if (!box) return;
        const text = box.innerText.replace(/\n{3,}/g, '\n\n').trim();
        const label = btn.getAttribute('data-copy-label');
        const lang = getLanguage();
        const ok = (lang === 'pt') ? 'Copiado!' : (lang === 'es' ? '¡Copiado!' : 'Copied!');
        function done() { btn.textContent = ok; setTimeout(function() { btn.textContent = label; }, 1500); }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(done, function() {});
        }
      };

      window.initJailbreakWizard = function() {
        const customIpInput = document.getElementById('customIpInput');
        if (customIpInput) customIpInput.value = currentWizardIp;
        updateWizardUI();
      };

      window.addEventListener('hashchange', function() {
        setTimeout(updateWizardUI, 150);
      });
    })();
  </script>
</body>
</html>
