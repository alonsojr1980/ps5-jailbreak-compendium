  <!-- Interactive Wizard Script -->
  <script>
    (function() {
      let currentWizardModel = localStorage.getItem('ps5_wizard_model') || 'fat';
      let storedFw = localStorage.getItem('ps5_wizard_fw');
      if (!storedFw || storedFw === '13.60' || storedFw === '9.60') {
        storedFw = '9.60 - 13.60';
      }
      let currentWizardFw = storedFw;
      let currentWizardIp = localStorage.getItem('ps5_wizard_ip') || '192.168.1.150';

      function getBracketForFw(val) {
        if (!val) return '9.60 - 13.60';
        const str = String(val).trim();
        if (str === '9.60 - 13.60' || str === '7.00 - 8.20' || str === '6.00 - 6.50' || str === '5.00 - 5.50' || str === '3.00 - 4.51' || str === '1.00 - 2.50') {
          return str;
        }
        const num = parseFloat(str);
        if (isNaN(num)) return '9.60 - 13.60';
        if (num <= 2.50) return '1.00 - 2.50';
        if (num <= 4.51) return '3.00 - 4.51';
        if (num <= 5.50) return '5.00 - 5.50';
        if (num <= 6.50) return '6.00 - 6.50';
        if (num <= 8.20) return '7.00 - 8.20';
        if (num <= 13.60) return '9.60 - 13.60';
        return '14.00+';
      }

      window.setWizardModel = function(model) {
        currentWizardModel = model;
        try { localStorage.setItem('ps5_wizard_model', model); } catch(e) {}
        updateWizardUI();
      };

      window.setWizardFw = function(fw) {
        currentWizardFw = fw;
        try { localStorage.setItem('ps5_wizard_fw', fw); } catch(e) {}
        updateWizardUI();
      };

      window.onCustomIpInput = function(val) {
        currentWizardIp = val.trim() || '192.168.1.150';
        try { localStorage.setItem('ps5_wizard_ip', currentWizardIp); } catch(e) {}
        updateWizardUI();
      };

      let currentWizardTab = 'no-pc';
      try {
        const savedTab = localStorage.getItem('ps5_wizard_tab');
        if (savedTab === 'with-pc' || savedTab === 'no-pc') currentWizardTab = savedTab;
      } catch(e) {}

      window.switchWizardTab = function(tab) {
        currentWizardTab = tab;
        try { localStorage.setItem('ps5_wizard_tab', tab); } catch(e) {}
        const tabBtns = document.querySelectorAll('.ps-res-tab-btn');
        tabBtns.forEach(function(b) {
          if (b.getAttribute('data-tab') === tab) {
            b.classList.add('active');
          } else {
            b.classList.remove('active');
          }
        });
        const paneNoPc = document.getElementById('psTabPaneNoPc');
        const paneWithPc = document.getElementById('psTabPaneWithPc');
        if (paneNoPc && paneWithPc) {
          if (tab === 'no-pc') {
            paneNoPc.style.display = 'block';
            paneWithPc.style.display = 'none';
          } else {
            paneNoPc.style.display = 'none';
            paneWithPc.style.display = 'block';
          }
        }
      };

      function getLanguage() {
        const hash = window.location.hash || '';
        if (hash.includes('/i18n/pt/')) return 'pt';
        if (hash.includes('/i18n/es/')) return 'es';
        return 'en';
      }

      function updateWizardUI() {
        const modelBtns = document.querySelectorAll('.ps-model-btn');
        modelBtns.forEach(function(btn) {
          if (btn.getAttribute('data-model') === currentWizardModel) {
            btn.classList.add('active');
          } else {
            btn.classList.remove('active');
          }
        });

        const activeBracket = getBracketForFw(currentWizardFw);

        const exploitBtns = document.querySelectorAll('.ps-exploit-btn');
        exploitBtns.forEach(function(btn) {
          if (btn.getAttribute('data-fw') === activeBracket) {
            btn.classList.add('active');
          } else {
            btn.classList.remove('active');
          }
        });

        const resultContainer = document.getElementById('psWizardResult');
        if (!resultContainer) return;

        const lang = getLanguage();
        const model = currentWizardModel;
        const ip = currentWizardIp || '192.168.1.150';
        const bracket = activeBracket;

        let statusClass = 'ready';
        let statusBadge = '';
