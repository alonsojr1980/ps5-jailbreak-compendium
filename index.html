    (function() {
      const DEFAULT_WIDTH = 320;
      const MIN_WIDTH = 240;
      const MAX_WIDTH = 640;
      const STORAGE_KEY = 'ps5_compendium_sidebar_width';

      let currentWidth = parseInt(localStorage.getItem(STORAGE_KEY), 10) || DEFAULT_WIDTH;
      currentWidth = Math.min(Math.max(currentWidth, MIN_WIDTH), MAX_WIDTH);

      const root = document.documentElement;
      const resizer = document.getElementById('sidebar-resizer');
      const tooltip = document.getElementById('resizer-tooltip');

      function applyWidth(width) {
        root.style.setProperty('--sidebar-width', width + 'px');
        if (tooltip) {
          tooltip.textContent = width + 'px';
        }
      }

      applyWidth(currentWidth);

      // Mouse and Touch Drag Handling
      let isDragging = false;
      let startX = 0;
      let startWidth = currentWidth;

      function onPointerDown(e) {
        isDragging = true;
        startX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
        startWidth = parseInt(getComputedStyle(root).getPropertyValue('--sidebar-width'), 10) || DEFAULT_WIDTH;
        resizer.classList.add('is-dragging');
        document.body.style.cursor = 'col-resize';
        document.body.style.userSelect = 'none';
        e.preventDefault();
      }

      function onPointerMove(e) {
        if (!isDragging) return;
        const clientX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
        const deltaX = clientX - startX;
        let newWidth = startWidth + deltaX;

        if (newWidth < MIN_WIDTH) newWidth = MIN_WIDTH;
        if (newWidth > MAX_WIDTH) newWidth = MAX_WIDTH;

        applyWidth(newWidth);
      }

      function onPointerUp() {
        if (!isDragging) return;
        isDragging = false;
        resizer.classList.remove('is-dragging');
        document.body.style.cursor = '';
        document.body.style.userSelect = '';

        const finalWidth = parseInt(getComputedStyle(root).getPropertyValue('--sidebar-width'), 10) || DEFAULT_WIDTH;
        localStorage.setItem(STORAGE_KEY, finalWidth);
      }

      resizer.addEventListener('mousedown', onPointerDown);
      window.addEventListener('mousemove', onPointerMove);
      window.addEventListener('mouseup', onPointerUp);

      // Touch events for touchscreens/tablets
      resizer.addEventListener('touchstart', onPointerDown, { passive: false });
      window.addEventListener('touchmove', onPointerMove, { passive: true });
      window.addEventListener('touchend', onPointerUp);

      // Double-click to reset width
      resizer.addEventListener('dblclick', function() {
        applyWidth(DEFAULT_WIDTH);
        localStorage.setItem(STORAGE_KEY, DEFAULT_WIDTH);
      });

      // Enhance Sidebar with Modern PS5 Header Branding
      function enhanceSidebar() {
        const sidebar = document.querySelector('.sidebar');
        if (!sidebar) return;

        if (!sidebar.querySelector('.sidebar-header-custom')) {
          const header = document.createElement('div');
          header.className = 'sidebar-header-custom';
          header.innerHTML = `
            <a href="#/" class="brand-title">
              <span>PS5 JAILBREAK</span>
              <span class="brand-badge">COMPENDIUM</span>
            </a>
            <div class="brand-sub">
              <span>By <strong class="brand-author">ALONSOJR1980</strong></span>
              <span class="fw-chip">FW 1.00 – 13.60</span>
            </div>
          `;
          sidebar.insertBefore(header, sidebar.firstChild);
        }
      }

      // Observe DOM to inject custom header once Docsify initializes sidebar
      const observer = new MutationObserver(function() {
        enhanceSidebar();
      });
      observer.observe(document.body, { childList: true, subtree: true });
      setTimeout(enhanceSidebar, 200);
      setTimeout(enhanceSidebar, 800);
    })();
  </script>
</body>
</html>
