  <!-- Resizable Sidebar Manager with Bulletproof Handle Binding -->
  <script>
    (function initResizableSidebar() {
      const DEFAULT_WIDTH = 320;
      const MIN_WIDTH = 240;
      const MAX_WIDTH = 640;
      const STORAGE_KEY = 'ps5_compendium_sidebar_width';

      let currentWidth = parseInt(localStorage.getItem(STORAGE_KEY), 10) || DEFAULT_WIDTH;
      currentWidth = Math.min(Math.max(currentWidth, MIN_WIDTH), MAX_WIDTH);

      const root = document.documentElement;

      function setSidebarWidth(width) {
        currentWidth = Math.min(Math.max(width, MIN_WIDTH), MAX_WIDTH);
        root.style.setProperty('--sidebar-width', currentWidth + 'px');

        const sidebar = document.querySelector('.sidebar');
        if (sidebar) {
          sidebar.style.width = currentWidth + 'px';
        }
        const content = document.querySelector('.content');
        if (content) {
          content.style.left = currentWidth + 'px';
        }

        const tooltip = document.querySelector('.resizer-tooltip');
        if (tooltip) {
          tooltip.textContent = currentWidth + 'px';
        }
      }

      setSidebarWidth(currentWidth);

      let isDragging = false;
      let startX = 0;
      let startWidth = currentWidth;
      let activeHandle = null;

      function onPointerDown(e) {
        isDragging = true;
        startX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
        startWidth = currentWidth;
        activeHandle = e.currentTarget;
        if (activeHandle) {
          activeHandle.classList.add('is-dragging');
        }
        document.body.style.cursor = 'col-resize';
        document.body.style.userSelect = 'none';
        e.preventDefault();
        e.stopPropagation();
      }

      function onPointerMove(e) {
        if (!isDragging) return;
        const clientX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
        const deltaX = clientX - startX;
        setSidebarWidth(startWidth + deltaX);
      }

      function onPointerUp() {
        if (!isDragging) return;
        isDragging = false;
        if (activeHandle) {
          activeHandle.classList.remove('is-dragging');
          activeHandle = null;
        }
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
        localStorage.setItem(STORAGE_KEY, currentWidth);
      }

      window.addEventListener('mousemove', onPointerMove, { passive: true });
      window.addEventListener('mouseup', onPointerUp);
      window.addEventListener('touchmove', onPointerMove, { passive: true });
      window.addEventListener('touchend', onPointerUp);

      function attachSidebarEnhancements() {
        const sidebar = document.querySelector('.sidebar');
        if (!sidebar) return;

        // Ensure sidebar width is applied directly to the element style
        sidebar.style.width = currentWidth + 'px';
        const content = document.querySelector('.content');
        if (content) {
          content.style.left = currentWidth + 'px';

        // 1. Inject Header Branding if missing

          const header = document.createElement('div');
          header.className = 'sidebar-header-custom';
          header.innerHTML = `

              <span class="fw-chip">FW 1.00 – 13.60</span>
            </div>
            <div class="brand-symbols" title="PlayStation">
              <span>△</span><span>◯</span><span>✕</span><span>▢</span>
            </div>
          `;
          sidebar.insertBefore(header, sidebar.firstChild);
        }

        // 2. Inject Resizer Handle if missing inside sidebar
        if (!sidebar.querySelector('.sidebar-resizer-handle')) {
          const handle = document.createElement('div');
          handle.className = 'sidebar-resizer-handle';
          handle.setAttribute('title', 'Drag to resize sidebar • Double-click to reset');
          handle.innerHTML = `<div class="resizer-tooltip">${currentWidth}px</div>`;

          handle.addEventListener('mousedown', onPointerDown);
          handle.addEventListener('touchstart', onPointerDown, { passive: false });
          handle.addEventListener('dblclick', function(e) {
            e.stopPropagation();
            setSidebarWidth(DEFAULT_WIDTH);
            localStorage.setItem(STORAGE_KEY, DEFAULT_WIDTH);
          });

          sidebar.appendChild(handle);
        }
      }

      // Keep observing DOM for Docsify sidebar render events
      const observer = new MutationObserver(function() {
        attachSidebarEnhancements();
      });
      observer.observe(document.body, { childList: true, subtree: true });

      // Step Tiles Interactive Helper
      window.toggleAllSteps = function(shouldOpen) {
        const tiles = document.querySelectorAll('details.step-tile');
        tiles.forEach(function(tile) {
          tile.open = shouldOpen;
        });
      };

      // Auto-expand step-tile if an anchor inside it is clicked or navigated to
      function checkHashAndExpandTile() {
        if (window.location.hash) {
          try {
            // Find element matching current hash
            const hashId = window.location.hash.split('?')[0].replace(/^#\/?/, '');
            const target = document.getElementById(hashId) || document.getElementById(decodeURIComponent(hashId));
            if (target) {
              const parentTile = target.closest('details.step-tile');
              if (parentTile && !parentTile.open) {
                parentTile.open = true;
                setTimeout(function() {
                  target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }, 150);
              }
            }
          } catch (e) {
            // ignore invalid selectors
          }
        }
      }

      // ============================================================
      // PLAYSTATION QUEST & TROPHY SYSTEM ENGINE
      // ============================================================
      function playTrophyChime() {
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (!AudioContext) return;
          const ctx = new AudioContext();
          const osc1 = ctx.createOscillator();
          const osc2 = ctx.createOscillator();
          const gain = ctx.createGain();

          osc1.type = 'triangle';
          osc2.type = 'sine';

          osc1.frequency.setValueAtTime(587.33, ctx.currentTime); // D5
          osc1.frequency.setValueAtTime(880.00, ctx.currentTime + 0.08); // A5
          osc2.frequency.setValueAtTime(1174.66, ctx.currentTime + 0.08); // D6

          gain.gain.setValueAtTime(0.18, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.65);

          osc1.connect(gain);
          osc2.connect(gain);
          gain.connect(ctx.destination);

          osc1.start();
          osc2.start(ctx.currentTime + 0.08);
          osc1.stop(ctx.currentTime + 0.65);
          osc2.stop(ctx.currentTime + 0.65);
        } catch (e) {}
      }

      let toastTimer = null;
      function showTrophyToast(name, rank, icon) {
        const toast = document.getElementById('ps5TrophyToast');
        if (!toast) return;
        const nameEl = document.getElementById('ps5ToastName');
        const rankEl = document.getElementById('ps5ToastRank');
        const iconEl = document.getElementById('ps5ToastIcon');
        if (nameEl) nameEl.textContent = name || 'Mission Accomplished';
        if (rankEl) rankEl.textContent = (rank || 'BRONZE TROPHY').toUpperCase();
        if (iconEl) iconEl.textContent = icon || '🏆';

        toast.classList.add('show');
        playTrophyChime();

        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(function() {
          toast.classList.remove('show');
        }, 4500);
      }

      window.toggleQuest = function(questId, trophyName, trophyRank, icon) {
        let quests = [];
        try {
          quests = JSON.parse(localStorage.getItem('ps5_jb_quests') || '[]');
        } catch(e) { quests = []; }

        const index = quests.indexOf(questId);
        const isNowCompleted = (index === -1);

        if (isNowCompleted) {
          quests.push(questId);
          showTrophyToast(trophyName, trophyRank, icon);
        } else {
          quests.splice(index, 1);
        }

        try {
          localStorage.setItem('ps5_jb_quests', JSON.stringify(quests));
        } catch(e) {}

        window.initQuestSystem();
      };

      window.resetAllQuests = function() {
        try {
          localStorage.removeItem('ps5_jb_quests');
        } catch(e) {}
        window.initQuestSystem();
      };

      window.initQuestSystem = function() {
        let quests = [];
        try {
          quests = JSON.parse(localStorage.getItem('ps5_jb_quests') || '[]');
        } catch(e) { quests = []; }

        const tiles = document.querySelectorAll('details.step-tile[data-quest]');
        const totalQuests = tiles.length || 5;
        let completedCount = 0;

        tiles.forEach(function(tile) {
          const qId = tile.getAttribute('data-quest');
          const isDone = quests.includes(qId);
          if (isDone) {
            completedCount++;
            tile.classList.add('quest-completed');
          } else {
            tile.classList.remove('quest-completed');
          }

          const btn = tile.querySelector('.quest-complete-btn');
          if (btn) {
            if (isDone) {
              btn.classList.add('completed');
              btn.innerHTML = '<span>✓</span> ' + (btn.getAttribute('data-done-text') || 'Mission Accomplished');
            } else {
              btn.classList.remove('completed');
              btn.innerHTML = '<span>◯</span> ' + (btn.getAttribute('data-todo-text') || 'Mark Accomplished');
            }
          }
        });

        // Update HUD
        const fillBar = document.getElementById('psProgressFill');
        const pctText = document.getElementById('psProgressPct');
        const countText = document.getElementById('psTrophiesCount');
        const rankIcon = document.getElementById('psRankIcon');

        const pct = Math.round((completedCount / totalQuests) * 100);

        if (fillBar) fillBar.style.width = pct + '%';
        if (pctText) pctText.textContent = pct + '%';
        if (countText) countText.textContent = completedCount + ' / ' + totalQuests;
        if (rankIcon) {
          if (pct === 100) rankIcon.textContent = '🏆';
          else if (pct >= 80) rankIcon.textContent = '🥇';
          else if (pct >= 40) rankIcon.textContent = '🥈';
          else rankIcon.textContent = '🎮';
        }
      };

      window.addEventListener('hashchange', checkHashAndExpandTile);
      document.addEventListener('click', function(e) {
        const anchor = e.target.closest('a');
        if (anchor && anchor.getAttribute('href') && anchor.getAttribute('href').includes('#')) {
          setTimeout(checkHashAndExpandTile, 200);
        }
      });
    })();
  </script>
</body>
